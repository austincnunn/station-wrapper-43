name: image

# Forgejo Actions on git.herbert.link (the runner is on alfred). Builds the image for amd64 only (arm64 under qemu took
# ~25 min on alfred; GitHub's ghcr.io copy stays multi-arch), checks and smoke-tests it, and publishes to Forgejo's registry:
#   main: git.herbert.link/austin/station-wrapper-43:latest and :main-<short-sha>
#   dev:  ...:dev and :dev-<short-sha>
# on every push to either, every Sunday (FieldStation42's newest commits arrive on their own), and on demand.
# Nothing is pushed unless the contract check, the station-schema test and the smoke test pass.
#
# alfred's /etc/hosts points git.herbert.link at Caddy over the tailnet: pushes must not go through Cloudflare, which
# refuses uploads over 100 MB (two layers are ~250 MB). GitHub (a push mirror of this repo) still builds ghcr.io's copy.
on:
  push:
    branches: [dev, main]
  schedule:
    - cron: "0 9 * * 0"
  workflow_dispatch:
    inputs:
      fs42_ref:
        description: "FieldStation42 branch, tag or commit to build with"
        default: main
        required: false

env:
  IMAGE: git.herbert.link/austin/station-wrapper-43

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the tags and the FieldStation42 commit
        env:
          FS42_REF: ${{ github.event.inputs.fs42_ref || 'main' }}
          GH_SHA: ${{ github.sha }}
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          printf '%s' "$FS42_REF" | grep -qE '^[A-Za-z0-9._][A-Za-z0-9._/-]*$' || { echo "invalid fs42_ref"; exit 1; }
          sha="$(echo "$GH_SHA" | cut -c1-7)"
          branch="$GH_REF_NAME"
          fs42="$(git ls-remote https://github.com/shane-mason/FieldStation42.git "$FS42_REF" | head -1 | cut -f1)"
          if [ -z "$fs42" ]; then
            printf '%s' "$FS42_REF" | grep -qE '^[0-9a-fA-F]{7,40}$' || { echo "unknown ref: $FS42_REF"; exit 1; }
            fs42="$FS42_REF"
          fi
          {
            echo "SHA=$sha"
            echo "TAG=$branch-$sha"
            echo "MOVING=$([ "$branch" = main ] && echo latest || echo dev)"
            echo "FS42=$fs42"
            echo "DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"

      - name: Log in to the registry
        # Forgejo's automatic token can't write packages: REGISTRY_TOKEN is a personal token with package read+write
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          [ -n "$REGISTRY_TOKEN" ] || { echo "set the repo secret REGISTRY_TOKEN (a token with package: read and write)"; exit 1; }
          printf '%s\n' "$REGISTRY_TOKEN" | docker login git.herbert.link -u austin --password-stdin

      - name: Build, check, smoke-test, push
        run: |
          set -euo pipefail
          ref="$IMAGE:$TAG"
          docker build -t "$ref" -t "$IMAGE:$MOVING" \
            --build-arg FS42_REF="$FS42" --build-arg BUILD_REF="$TAG" --build-arg BUILD_SHA="$SHA" \
            --build-arg BUILD_DATE="$DATE" .
          echo "FieldStation42 in the image: $(docker run --rm --entrypoint cat "$ref" /opt/FS42_REF | cut -c1-7)"
          tar -cf - scripts fs42-tuner | docker run --rm -i -e FS42_SRC=/app --entrypoint sh "$ref" -c \
            'mkdir /tmp/w && tar -xf - -C /tmp/w && cd /tmp/w &&
             python3 scripts/check-fs42-contract.py /app &&
             python3 scripts/test_build_channels.py FieldStationSchemaTest &&
             cd fs42-tuner && python3 test_stationform.py'
          scripts/smoke-image.sh "$ref"
          docker push -q "$ref"
          docker push -q "$IMAGE:$MOVING"
          echo "published $ref and :$MOVING (amd64)"
