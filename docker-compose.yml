# ============================================================================
#  ONE image, ONE container, THREE volumes (plus two small containers for the weather channel, at the
#  bottom, only with COMPOSE_PROFILES=weather in .env). Nothing to edit: `docker compose up -d`
#  works as this file is, and makes two folders beside it:
#      ./data    the container's own data (config/ and catalog/)
#      ./media   put videos here, or point FS42_MEDIA_ROOT at the folder you have
#  To change one, put a line in a file called .env beside this one, for example
#      FS42_MEDIA_ROOT=/mnt/media
#  (.env.example lists every setting; none is required).
#
#  CONFIG   (FS42_CONFIG_ROOT, default ./data/config)   LOCAL DISK, not a network share.
#      runtime/    FieldStation42's schedule database and sockets (sqlite: it
#                  misbehaves over SMB/NFS)
#      confs/      station configs
#      tuner/      the dashboard's config.json (created on first start)
#      groups.toml your channel-building settings, if you use it
#
#  CATALOG  (FS42_CATALOG_ROOT, default ./data/catalog)  NOT an SMB/CIFS share. LOCAL DISK.
#      by-genre/     the tag folders FieldStation42 schedules from
#      media-links/  a symlink for every video on your media (SYNC_ENABLED)
#    All of it is SYMLINKS into your media. SMB shares refuse to create symlinks, or
#    follow an absolute link on the server instead of in the container, so on a share
#    every link is missing or dead. The container refuses to start if the catalog is on
#    SMB or can't hold a working symlink (override only for a share you have tested:
#    FS42_ALLOW_NETWORK_CATALOG=1).
#
#  MEDIA    (FS42_MEDIA_ROOT, default ./media)    Your NAS / SMB shares are fine.
#    Mounted read-only at /mnt/media. The WHOLE folder is shared in, and so are shares
#    mounted inside it on the host (/mnt/media/tv from one NAS, /mnt/media/movies from
#    another): a bind mount is recursive.
#    To share in only SOME folders instead (say /mnt/media/youtube, /mnt/media/anime,
#    /mnt/media/movies), use one line per folder: see "ONLY SOME FOLDERS" below.
#    Videos are only read, through links that sit on local disk.
#
#  In short: CONFIG and CATALOG are the container's own data and must be LOCAL disk; MEDIA (and any
#  optional guide-music or channel-logos folders you share in) is read-only and may be on a NAS or local.
#  docker-compose.sample.yml shows the same layout with one volume per media folder.
#
#  FS42_LOCAL_ROOT moves ./data (both config/ and catalog/) to another LOCAL folder.
#  Docker makes a missing folder itself, owned by root. (Coming from an older layout?
#  ./setup-dirs.sh --migrate moves it into this one.)
# ============================================================================
name: station-wrapper-43

services:
  station-wrapper-43:
    image: ghcr.io/austincnunn/station-wrapper-43:${FS42_TAG:-latest}
    # No `build:` here on purpose: with one, a first `up` beside a lone compose file tries to build and fails.
    # Your own build: docker build -t ghcr.io/austincnunn/station-wrapper-43:latest .   then `docker compose up -d`.
    container_name: station-wrapper-43
    volumes:
      - ${FS42_CONFIG_ROOT:-${FS42_LOCAL_ROOT:-./data}/config}:/config
      # CATALOG: MUST NOT be an SMB/CIFS share. Local disk. See the header.
      - ${FS42_CATALOG_ROOT:-${FS42_LOCAL_ROOT:-./data}/catalog}:/app/catalog
      - ${FS42_MEDIA_ROOT:-./media}:/mnt/media:ro
      # ONLY SOME FOLDERS: delete the media line above and add one line like this per folder.
      # The folder name must match the host's.
      #   - /mnt/media/youtube:/mnt/media/youtube:ro
      #   - /mnt/media/anime:/mnt/media/anime:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${FS42_CONSOLE_BIND:-127.0.0.1}:4242:4242"     # FieldStation42's console (has no login: kept on localhost unless FS42_CONSOLE_BIND=0.0.0.0)
      - "5004:5004"     # the dashboard and player: what's on, watch a channel
      # - "5005:5005"   # the web viewer (see VIEWER_PORT below): the player alone, with a login for each viewer
    environment:
      # Leave unset. Only for a config or catalog on a share where you have tested it.
      FS42_ALLOW_NETWORK_CATALOG: ${FS42_ALLOW_NETWORK_CATALOG:-}
      # OPTIONAL: keep the symlink pool (catalog/media-links) current, and watch the tag folders.
      #  - every SYNC_INTERVAL_MINUTES it adds a symlink for each new video on the media
      #    (add-only; it never removes or rewrites a link),
      #  - it notices tag folders that changed since their catalog was last updated, and once a day
      #    (in the SYNC_REBUILD_HOUR window) updates those stations' catalogs with the new videos.
      #    The schedule is NOT touched: the new videos are used the next time days are added.
      #    On by default; SYNC_REBUILD=0 only reports.
      SYNC_ENABLED: ${SYNC_ENABLED:-}
      # ON by default: keeps catalog/by-genre filled with tag folders of links, so FieldStation42's
      # console has something to build stations from. Genres come from the NFO files, shows
      # with no genre go under Unclassified.
      # Add-only. It does not create stations or schedules: do that in the console (:4242).
      # FARM_ENABLED=0 turns it off.
      FARM_ENABLED: ${FARM_ENABLED:-1}
      # ON by default: a brand new install gets a test station (channel 0, a test card) so something is on air
      # at once. It runs once, never touches an install that already has stations, and you can delete it in the
      # console. 0 turns it off.
      FIRSTRUN_TEST_STATION: ${FIRSTRUN_TEST_STATION:-1}
      FIRSTRUN_GUIDE_STATION: ${FIRSTRUN_GUIDE_STATION:-1}
      # The schedule keeper (ON by default) tops every station that has a schedule up to a number of days ahead,
      # because FieldStation42 only does that inside its on-screen player, which this container never runs.
      # You normally change it on the Stations page; these are only its STARTING values (a choice saved
      # there wins).
      SCHEDULE_KEEPER: ${SCHEDULE_KEEPER:-}
      KEEPER_DAYS_AHEAD: ${KEEPER_DAYS_AHEAD:-}
      KEEPER_INTERVAL_MINUTES: ${KEEPER_INTERVAL_MINUTES:-30}
      FIRSTRUN_CLIP_SECONDS: ${FIRSTRUN_CLIP_SECONDS:-60}
      # The dashboard's management pages (Stations, Schedule, Files and the YouTube panel) are behind a LOGIN, ON by
      # default: the first visit asks you to set a password. DASHBOARD_PASSWORD sets it without that page (only if
      # none is set yet); DASHBOARD_LOGIN=0 switches the login off (for a login of your own in front). The player and
      # the HDHomeRun / guide endpoints other clients use stay open. FieldStation42's own console on :4242 is NOT
      # covered: keep that port off the internet.
      DASHBOARD_LOGIN: ${DASHBOARD_LOGIN:-1}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      # DASHBOARD_EDIT=0 makes the management pages look-only, even when logged in.
      # OPTIONAL: the web viewer. VIEWER_PORT=5005 (and its ports line above) serves the player alone on that port:
      # each viewer logs in with a name and password and gets only the channels picked for them on Settings > Viewers.
      # Port 5004 still lets anyone watch everything, so give viewers the viewer's port only (reverse proxy, firewall).
      VIEWER_PORT: ${VIEWER_PORT:-}
      DASHBOARD_EDIT: ${DASHBOARD_EDIT:-1}
      FARM_INTERVAL_MINUTES: ${FARM_INTERVAL_MINUTES:-30}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-60}
      SYNC_FULL_EVERY_HOURS: ${SYNC_FULL_EVERY_HOURS:-24}
      SYNC_INCLUDE: ${SYNC_INCLUDE:-}
      SYNC_EXCLUDE: ${SYNC_EXCLUDE:-}
      SYNC_PRUNE: ${SYNC_PRUNE:-}
      SYNC_REBUILD: ${SYNC_REBUILD:-}
      SYNC_REBUILD_HOUR: ${SYNC_REBUILD_HOUR:-4}
      SYNC_REBUILD_WINDOW_HOURS: ${SYNC_REBUILD_WINDOW_HOURS:-2}
      # Read-ahead (see the tmpfs line above). On by default; it needs the /cache RAM disk or it stays off and says why.
      PREFETCH: ${PREFETCH:-1}
      PREFETCH_RAM: ${PREFETCH_RAM:-1}
      PREFETCH_DIR: ${PREFETCH_DIR:-/cache}
      PREFETCH_MAX_MB: ${PREFETCH_MAX_MB:-5400}
      # OPTIONAL: names, synopses, air dates and posters for the guide from Emby or Jellyfin (either; detected), for videos
      # with no .nfo beside them. Off unless both the address and an API key are set. See .env.example.
      MEDIA_SERVER_URL: ${MEDIA_SERVER_URL:-}
      MEDIA_SERVER_API_KEY: ${MEDIA_SERVER_API_KEY:-}
      MEDIA_SERVER_MEDIA_ROOT: ${MEDIA_SERVER_MEDIA_ROOT:-/media}
      # The weather channel (the two containers at the bottom of this file). OFF by default: COMPOSE_PROFILES=weather
      # in .env starts them and adds the channel (channel 3, or the next free number).
      # Its place (a ZIP code, or City, State; United States only) is normally set on the dashboard's Settings page;
      # WEATHER_LOCATION here is only the starting value.
      # This tells the container to add the channel: 1 whenever a profile is on, and this file has only the one.
      WEATHER_CHANNEL: ${WEATHER_CHANNEL:-${COMPOSE_PROFILES:+1}}
      WEATHER_LOCATION: ${WEATHER_LOCATION:-}
    labels:
      fs42.requires: "config and catalog on LOCAL disk, not an SMB share (./data, or FS42_LOCAL_ROOT)"
    restart: unless-stopped
    # The read-ahead cache (PREFETCH): the next break or episode is copied into RAM before it is due, so a slow network
    # share doesn't make a viewer wait. This is that RAM: nothing is written to a drive. It counts against the memory
    # you give Docker (and its VM); lower the size if that is tight. To use a folder on disk instead, remove this and set
    # PREFETCH_RAM=0 and PREFETCH_DIR to the folder; to turn the read-ahead off, set PREFETCH=0.
    tmpfs:
      - /cache:size=${PREFETCH_CACHE_SIZE:-6g},mode=1777
    # Docker keeps a container's log forever by default and a chatty one can fill the disk: keep the last 60 MB.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ---- the weather channel: a 1990s WeatherStar 4000 forecast, with the music --------------------------------------
  # Two small containers. ws4kp is the weather page (netbymatt/ws4kp; United States forecasts, from the National
  # Weather Service). ws4channels (rice9797/ws4channels) opens a page in a hidden browser and turns it into a stream;
  # the page it opens is this server's own /weather, which shows ws4kp for the place set on the Settings page.
  # Neither publishes a port: only the container above talks to them.
  # OFF unless COMPOSE_PROFILES=weather is in .env (then: docker compose up -d). Why off: the hidden browser runs all
  # day, watched or not (about one CPU core and 1 GB of memory), and ws4channels only exists for amd64 machines, so on a
  # Raspberry Pi or other ARM machine it cannot start.
  # They are behind a profile, not scale: 0, because Compose downloads the image of every service that is not behind
  # one, even a service that will not run. (This switch was WEATHER_CHANNEL=1 until November 2026.)
  ws4kp:
    image: ghcr.io/netbymatt/ws4kp
    container_name: station-wrapper-43-ws4kp
    profiles: ["weather"]
    restart: unless-stopped
    logging: &weather-logging
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  ws4channels:
    image: ghcr.io/rice9797/ws4channels:latest
    platform: linux/amd64      # the only kind its author publishes
    container_name: station-wrapper-43-ws4channels
    profiles: ["weather"]
    restart: unless-stopped
    depends_on:
      - station-wrapper-43
    mem_limit: 1096m
    cpus: 1.0
    environment:
      PERMALINK_URL: http://station-wrapper-43:5004/weather
      VIEW_MODE: standard
    logging: *weather-logging
