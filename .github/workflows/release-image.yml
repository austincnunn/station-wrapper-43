name: release-image

# Publishes the versioned image when a v* tag is pushed: :<version> and :latest. Tags are
# created only after the dev -> main PR has gone green (see the gated release sequence).
# Built for amd64 and arm64, each smoke-tested on a runner of its own architecture; the tags are published (as one
# multi-arch tag) only when both pass.
on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE: station-wrapper-43

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      fs42: ${{ steps.p.outputs.fs42 }}
    steps:
      - id: p
        # FieldStation42's main, fixed to one commit here so both architectures carry the same one
        run: echo "fs42=$(git ls-remote https://github.com/shane-mason/FieldStation42.git main | cut -f1)" >> "$GITHUB_OUTPUT"

  build:
    needs: prep
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build, smoke-test, push (${{ matrix.arch }})
        run: |
          set -euo pipefail
          image="$REGISTRY/$(echo "${{ github.repository_owner }}" | tr A-Z a-z)/$IMAGE"
          ver="${GITHUB_REF_NAME#v}"
          ref="$image:$ver-${{ matrix.arch }}"
          docker build -t "$ref" --build-arg FS42_REF="${{ needs.prep.outputs.fs42 }}" \
            --build-arg BUILD_REF="$ver" --build-arg BUILD_SHA="$(echo "${{ github.sha }}" | cut -c1-7)" \
            --build-arg BUILD_DATE="$(git log -1 --format=%cI)" .
          scripts/smoke-image.sh "$ref"
          docker run --rm aquasec/trivy:0.58.1 image --severity HIGH,CRITICAL --exit-code 0 "$ref" || true
          docker push "$ref"

  publish:
    needs: [prep, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish one tag for both architectures
        run: |
          set -euo pipefail
          image="$REGISTRY/$(echo "${{ github.repository_owner }}" | tr A-Z a-z)/$IMAGE"
          ver="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create -t "$image:$ver" -t "$image:latest" "$image:$ver-amd64" "$image:$ver-arm64"
