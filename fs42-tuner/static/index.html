<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station Wrapper 43 -- Channels</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/dashboard.css">
<link rel="stylesheet" href="/views.css">
</head>
<body>
  <main id="dash">
    <header class="dash-head">
      <h1>Channels</h1>
      <span id="summary" class="dim"></span>
    </header>

    <section id="setup" class="panel setup" hidden aria-label="Getting started"></section>
    <section id="channels" class="channels" aria-label="Channels"></section>

    <details id="sys" class="fold">
      <summary><h2>System</h2><span id="sys-summary" class="fold-summary"></span></summary>
      <div id="stats" class="stats"></div>
    </details>

    <details id="lib" class="fold">
      <summary><h2>Library</h2><span id="lib-summary" class="fold-summary"></span></summary>
      <div class="lib-tools">
        <input id="lib-filter" type="search" placeholder="Find a list…" aria-label="Find a list">
        <button id="lib-rescan" class="lib-rescan" type="button">Rescan</button>
      </div>
      <div id="library" class="lib-tags"></div>
    </details>
    <p id="status-line" class="status-line"></p>
  </main>

  <script src="/common.js"></script>
  <script>W.nav("dashboard");</script>
  <script src="/dashboard.js"></script>
</body>
</html>
